[project]
name = "llm-websearch"
version = "0.1a0"
description = "LLM plugin for web searching and deep searching with token optimization."
readme = "README.md"
requires-python = ">=3.9" # Updated Python requirement for dependencies like google-generativeai
dependencies = [
    "aiolimiter",
    "google-generativeai",
    "llm",
    "click",
    "httpx",
    "python-dotenv",
    "diskcache",
    "beautifulsoup4",
    "pydantic>=2.0", 
    "pydantic-settings"
]

[project.entry-points.llm]
websearch = "llm_websearch"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "respx" 
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."] 
include = ["llm_websearch*"] 

