[project]
name = "llm-websearch"
version = "0.1.0"
description = "LLM plugin for web searching and deep searching."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "llm",
    "click",
    "httpx",
    "python-dotenv",
    "diskcache",
    "beautifulsoup4",
]

[project.entry-points.llm]
websearch = "llm_websearch"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "unittest-mock",
]

[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
